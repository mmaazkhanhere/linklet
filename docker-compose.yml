services:
  postgres:
    image: postgres:16-alpine
    container_name: linklet_postgres
    restart: always
    environment:
      POSTGRES_USER: linklet_user
      POSTGRES_PASSWORD: linklet_password
      POSTGRES_DB: linklet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linklet_user -d linklet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
